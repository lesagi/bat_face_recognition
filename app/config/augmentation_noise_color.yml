augmentation:
  output_naming: '_a-{index:03d}'
  presets:
    noise_color_only:
      default_steps_per_attribute: 3
      # Disable all geometric transformations
      rotation: {'enabled': false}
      scale: {'enabled': false}
      perspective: {'enabled': false}
      
      # Enable only noise and color transformations
      brightness: {'limit': 0.3, 'steps': 3}
      # contrast: {'limit': 0.8, 'steps': 3}
      # saturation: {'limit': 0.8, 'steps': 3}
      # hue_shift: {'limit': 300, 'steps': 3}
      noise: {'limit': 0.3, 'steps': 3}
      gaussian_noise: {'limit': 100, 'steps': 3}
      # iso_noise: {'enabled': true, 'intensity': [0.8, 1.0], 'color_shift': [0.5, 1.0], 'steps': 3}
      
      # Additional color variations
      # rgb_shift: {'limit': 15, 'steps': 2}
      
      # Ensure no other effects
      blur: {'enabled': false}
      motion_blur: {'enabled': false}
  
  # Override default settings
  default_augmentations_per_image: 8  # Reasonable number for noise/color only
  
  # YOLO detection settings (if needed)
  yolo_detection:
    bbox_min_visibility: 0.3
    bbox_format: 'yolo'
  
  # YOLO segmentation settings (if needed)
  yolo_segmentation:
    mask_interpolation: 'nearest'
    segmentation_simplification: 0.005
