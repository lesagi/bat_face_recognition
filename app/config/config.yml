# Bat Face Recognition Project - General Configuration
# This file contains all configuration parameters for the entire project

# =============================================================================
# GENERAL APPLICATION SETTINGS
# =============================================================================
general:
  # GPU Configuration
  gpu_enabled: true
  
  # Random seed for reproducibility
  random_seed: 42

# =============================================================================
# MLFLOW CONFIGURATION
# =============================================================================
mlflow:
  enabled: true
  tracking:
    host: "localhost"
    port: 8080
    uri: "./mlruns"

# =============================================================================
# MODELS CONFIGURATION
# =============================================================================
models:
  segmentation:
    model_path: "/home/sagilevi1/bat_face_rec_project/legacy/rousesttus_segmentation/training_results/runs/segment/bat_face_seg/weights/best.pt"
    model_type: "yolo_segmentation"
    confidence_threshold: 0.5

  pose:
    model_path: "/home/sagilevi1/bat_face_rec_project/legacy/face_annotation_eyes_nose/runs/pose/augmented_train/weights/best.pt"
    model_type: "yolo_pose"
    confidence_threshold: 0.5

  siamese:
    model_path: "legacy/face_rec_rousettus_#1/runs/model/siamesemodelv2_v40"
    model_type: "siamese_network"

# =============================================================================
# SIAMESE NETWORK CONFIGURATION
# =============================================================================
siamese_network:
  # Model architecture
  model:
    input_edge_length: 105
    embedding:
      output_size: 4096
      activation: "sigmoid"
    distance:
      type: "L1"
      layer_name: "distance"
  
  # Training configuration
  training:
    # Base path per species where output directories will be created (actual dir name: {date}_{experiment_id}_{run_id})
    # Training input directory is selected by --background (green_bg_input / random_bg_input / original_bg_input)
    output_dir:
      mauritius: "/home/sagilevi1/bat_face_rec_project/models/siamese/mauritius"
      rousettus: "/home/sagilevi1/bat_face_rec_project/models/siamese/rousettus"
    epochs: 80
    batch_size: 32
    learning_rate: 0.00005  # Reduced from 0.0001 to prevent overfitting
    
    # Class balancing configuration
    class_balancing:
      enabled: true
      anchor_negative_balance: true  # Balance positive vs negative pairs (per-batch adaptive)
      per_class_balance: true  # Balance across different classes (globally computed)
      weighting_scheme: "isns"  # Changed to ISNS (gentler weighting than INS)
      ens_beta: 0.9  # Beta parameter for ENS scheme (0.9, 0.99, 0.999, 0.9999)
      # Required when per_class_balance=true: strategy for computing global class distribution
      global_distribution_strategy: "sampled"  # Options: "file_based" (fast, approximate), "sampled" (balanced), "full_scan" (slow, accurate)
      sampling_percentage: 0.1  # For 'sampled' strategy: fraction of data to sample (0.0-1.0)
      # Strategy for combining weights of multiple classes in negative pairs
      negative_pair_combination: "sum"  # Options: "sum" (stable, recommended), "geometric_mean" (balanced), "product" (aggressive)
    optimizer:
      type: "Adam"
      beta_1: 0.9
      beta_2: 0.999
      epsilon: 1e-07
    loss:
      type: "BinaryCrossentropy"
      from_logits: false
    train_val_split: 0.7
    split_mode: "image_split" # "image_split" (per-bat image split) or "bat_split" (disjoint bat classes)
    pair_mode: "permutation" # "permutation" or "combination"
    max_samples_per_class: 35
    early_stopping:
      enabled: true
      patience: 5  # Changed from 10 - detect overfitting faster
      min_delta: 0.001
      restore_best_weights: true

    # On-disk SavedModels: only best test metrics (optional toggles). Symlinks dedupe same-epoch ties.
    artifact_retention:
      save_best_f1: true
      save_best_recall: true
      save_best_precision: true
      save_best_loss: true
      save_final_model: false   # if true, fit() also writes default siamesemodelv2 at end
      save_tf_checkpoints: false  # if true, checkpoints/ with max_to_keep=1 for crash recovery only

    # Legacy: not read by trainer (training used hardcoded periodic saves before artifact_retention).
    checkpoint:
      save_frequency: 10
      save_best_only: true
      max_checkpoints: 5
    # Training data preprocessing configuration (pipeline-specific)
    data_preprocessing:
      target_size: 105
      interpolation: "bilinear"
      normalize: true
      scale_factor: 255.0
      face_outer_margin_ratio: 0.1
      background_replacement:
        enabled: false
        type: "picsum"
        # color: [0, 255, 0]  # options: blur, noise, gradient, picsum, solid_color
      
      # Prediction caching settings
      prediction_caching:
        enabled: true
        cache_size: 1000
        max_memory_mb: 512
        cache_ttl_hours: 24
        persistence: "memory"  # "memory" or "disk"
        cache_dir: "cache/predictions"
      
      # Augmentation settings
      augmentation:
        enabled: false
        preset: "noise_color_only"
        count: 5
        config_file: "/home/sagilevi1/bat_face_rec_project/app/config/augmentation_noise_color.yml"
        
        # Prediction transformation settings
        transform_predictions: true
        validate_transformations: true
  
  # Evaluation
  evaluation:
    metrics:
      - "accuracy"
      - "precision"
      - "recall"
      - "f1_score"
    frequency: 5
    confusion_matrix:
      enabled: true
      save_path: "confusion_matrix.png"
  
  # Input paths for different background types
  input_paths:
    mauritius:
      original_bg_input: "/home/sagilevi1/bat_face_rec_project/data/processed/mauritius/video/not_augmented/original_bg"
      random_bg_input: "/home/sagilevi1/bat_face_rec_project/data/processed/mauritius/video/not_augmented/random_bg"
      green_bg_input: "/home/sagilevi1/bat_face_rec_project/data/processed/mauritius/green_bg"
    rousettus:
      original_bg_input: "/home/sagilevi1/bat_face_rec_project/data/processed/rousettus/video/not_augmented/original_bg"
      random_bg_input: "/home/sagilevi1/bat_face_rec_project/data/processed/rousettus/video/not_augmented/random_bg"
      green_bg_input: null
  
  # Generate predictions configuration
  generate_predictions:
    # model_version is automatically set from best_f1_epoch during training
    subdirs: null  # Optional list of bat classes to process (e.g., ["W", "H", "rasmi"])
    verbose: false
    max_pairs: null  # Optional limit for testing (null = process all)
  
  # Saliency maps configuration
  saliency_maps:
    method: "integrated_gradients"  # Options: "standard", "integrated_gradients", "guided_gradients", "smoothed_gradients", "comparison", "mean_saliency"
    sample_size: 25
    samples_per_bat: 3  # Max images per bat class for per-bat saliency (null = all)
    fast_mode: false
    integration_steps: null  # Optional custom steps (default: 20, or 10 in fast mode)
    smoothing_samples: null  # Optional custom samples (default: 10, or 5 in fast mode)
    base_method: "guided_gradients"  # For mean_saliency method
    use_mean_image_background: false
  
  # Logging
  logging:
    tensorboard: true
    level: "INFO"
    plots:
      enabled: true
      save_path: "training_plots.png"
    console:
      show_progress: true
      metrics_frequency: 10
  
  # Advanced
  advanced:
    mixed_precision: true
    gradient_clipping:
      enabled: false
      clip_norm: 1.0
    prefetch:
      buffer_size: 8
    memory:
      allow_growth: true
      gpu_memory_limit: null
  
  # Deployment
  deployment:
    save_format: "tf"
    versioning:
      enabled: true
      version_prefix: "siamesemodel"
    optimization:
      tensorrt: false
      quantization: false

# =============================================================================
# YOLO SEGMENTATION TRAINER CONFIGURATION
# =============================================================================
yolo_segmentation:
  # Default training parameters
  training:
    default_epochs: 80
    default_batch_size: 16
    default_image_size: 640
    default_patience: 50
    default_workers: 8
    default_confidence: 0.25
    data_path: "/home/sagilevi1/bat_face_rec_project/legacy/unified_segmentation/data/data.yaml"
    name: "bat_face_seg"
  
  # Supported models
  supported_base_models:
    - "yolov8n-seg.pt"
    - "yolov8s-seg.pt"
    - "yolov8m-seg.pt"
    - "yolov8l-seg.pt"
    - "yolov8x-seg.pt"
  
  # Data preparation
  data:
    default_min_contour_area: 200
    supported_image_extensions:
      - ".png"
      - ".jpg"
      - ".jpeg"
      - ".bmp"
      - ".tiff"
  
  # Training outputs
  outputs:
    weights_dir: "weights"
    best_model: "best.pt"
    last_model: "last.pt"
    results_file: "results.csv"
    confusion_matrix: "confusion_matrix.png"
    validation_batch: "val_batch*.jpg"
  
  # Data augmentation settings
  augmentation:
    default_augmentations_per_image: 10
    postfix_format: "_a-{index:03d}"
    geometric_transforms:
      rotation_limit: 25
      scale_range: [0.8, 1.2]
      translate_percent: 0.1
      shear_limit: 8
      perspective_scale: [0.02, 0.08]
    color_transforms:
      brightness_limit: 0.2
      contrast_limit: 0.2
      saturation_limit: 0.2
      hue_shift_limit: 15
    noise_transforms:
      gaussian_var_limit: [5, 30]
      iso_noise_intensity: [0.1, 0.3]
    blur_transforms:
      blur_limit: 2
      motion_blur_limit: 2
    scale_crop_transforms:
      tight_crop_scale: [0.7, 0.9]  # Simulate tighter margins
      loose_crop_scale: [0.4, 0.7]  # Simulate looser margins
      resize_variations: [480, 640, 800]  # Different input sizes
      crop_ratio_range: [0.9, 1.1]  # Keep roughly square
  
  # Square crop configuration
  square_crop:
    default_buffer_multiplier: 1.1
    default_output_format: "jpg"
    default_quality: 95
    default_padding_strategy: "random_colors"
    auto_discover_datasets: true

# =============================================================================
# VIDEO PROCESSING CONFIGURATION
# =============================================================================
video_processing:
  # Processing limits
  processing_limit: 10
  
  # Paths
  paths:
    base_dir: "video_processing"
    input_dir: "raw_data/videos/input"
    processed_base_dir: "raw_data/videos/processed"
    processed_sub_dir: "segmentation"
  
  # Processing settings
  settings:
    frame_extraction_rate: 1
    output_format: "jpg"
    quality: 95

# =============================================================================
# VISUALIZATION CONFIGURATION
# =============================================================================
visualization:
  paths:
    model_path: null  # Set via --model-path CLI arg or experiment override
    input_dir: null   # Set via --input-dir CLI arg or experiment override
    output_dir: null  # Set via --output-dir CLI arg or experiment override
  display:
    nesting: "saliency"
    sample_size: 10
    figure_size: [15.0, 3.0]
    row_spacing: 0.5
    image_size: [105, 105]
  plots:
    dpi: 300
    save_format: "png"
    show_grid: false
    color_map: "viridis"

# =============================================================================
# UTILS CONFIGURATION
# =============================================================================
utils:
  file:
    max_file_size: 100
    supported_image_formats: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]
    supported_video_formats: [".mp4", ".avi", ".mov", ".mkv"]
  image:
    default_quality: 95
    default_format: "JPEG"
    max_dimension: 4096
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file_logging: true
    console_logging: true

# =============================================================================
# STATISTICAL TESTS CONFIGURATION
# =============================================================================
statistical_tests:
  # Permutation test for model significance validation
  permutation_test:
    # Number of permutation iterations to build null distribution
    # More iterations = more accurate p-value estimate, but longer runtime
    # Recommended: 100-1000 for final validation, 50-100 for quick checks
    n_permutations: 100
    
    # Number of training epochs per permutation iteration
    # Fewer epochs than full training since we only need approximate performance
    # Recommended: 5-15 epochs (enough to see if model can learn anything)
    permutation_epochs: 10
    
    # Significance level for hypothesis testing (alpha)
    # P-value below this threshold = statistically significant
    significance_level: 0.05
    
    # Metrics to test for significance
    # Each metric will have its own p-value calculated
    metrics_to_test:
      - "f1"
      - "accuracy"
      - "precision"
      - "recall"
    
    # Whether to save the full null distribution for each metric
    # Useful for visualization, but increases output file size
    save_null_distribution: true
    
    # Output directory for permutation test results
    # Will be created as: {output_dir}/{timestamp}/
    output_dir: "outputs/evaluations/permutation_tests"
    
    # Optimized mode settings for faster permutation test runs
    # Use --mode optimized to enable these settings
    optimized_mode:
      # Minimum permutations for p<0.01 capability
      n_permutations: 100
      # Epochs per permutation - enough for convergence signal
      permutation_epochs: 10
      # Use 50% of data -- null distribution is self-consistent since all permutations
      # use the same conditions. Main effect is slightly higher variance in null distribution.
      sample_fraction: 0.5
      # Smaller shuffle buffer
      shuffle_buffer_fraction: 0.5
      # Use SGD optimizer instead of Adam (saves ~3GB GPU memory)
      optimizer: "sgd"
      # Larger batch size for GPU utilization (default siamese batch_size is too small)
      batch_size: 128
      # Only evaluate on the final epoch (skip intermediate evaluations for speed)
      eval_last_only: true
