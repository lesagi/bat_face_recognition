{% extends "config_editor.html" %}

{% block content %}
{{ super() }}

<script>
    document.getElementById('runVisualization').addEventListener('click', async function() {
        const statusDiv = document.getElementById('visualizationStatus');
        statusDiv.innerHTML = '<div class="alert alert-info">Creating saliency maps...</div>';
        
        try {
            const response = await fetch('/create_saliency_maps', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            
            const result = await response.json();
            
            if (result.status === 'success') {
                statusDiv.innerHTML = `
                    <div class="alert alert-success">
                        ${result.message}<br>
                        Output saved to: ${result.output_path}
                    </div>
                `;
            } else {
                statusDiv.innerHTML = `
                    <div class="alert alert-danger">
                        Error: ${result.message}
                    </div>
                `;
            }
        } catch (error) {
            statusDiv.innerHTML = `
                <div class="alert alert-danger">
                    Error: ${error.message}
                </div>
            `;
        }
    });
</script>
{% endblock %}

{% block scripts %}
{{ super() }}
{% endblock %}
