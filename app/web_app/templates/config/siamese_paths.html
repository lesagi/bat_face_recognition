<!-- Siamese Network Paths Configuration -->
<form id="siamesePathsForm">
    <div class="mb-3">
        <label for="SIAMESE_PATHS.BASE" class="form-label">Base Directory</label>
        <input type="text" class="form-control" id="SIAMESE_PATHS.BASE" name="SIAMESE_PATHS.BASE" value="{{ config.SIAMESE_PATHS.BASE }}">
        <div class="form-text">Base directory for siamese network files</div>
    </div>

    <h6 class="mt-4">Training Paths</h6>
    <div class="mb-3">
        <label for="SIAMESE_PATHS.TRAINING.DATA" class="form-label">Training Data Directory</label>
        <input type="text" class="form-control" id="SIAMESE_PATHS.TRAINING.DATA" name="SIAMESE_PATHS.TRAINING.DATA" value="{{ config.SIAMESE_PATHS.TRAINING.DATA }}">
    </div>

    <div class="mb-3">
        <label for="SIAMESE_PATHS.TRAINING.OUTPUT" class="form-label">Output Directory</label>
        <input type="text" class="form-control" id="SIAMESE_PATHS.TRAINING.OUTPUT" name="SIAMESE_PATHS.TRAINING.OUTPUT" value="{{ config.SIAMESE_PATHS.TRAINING.OUTPUT }}">
    </div>

    <div class="mb-3">
        <label for="SIAMESE_PATHS.TRAINING.CHECKPOINTS" class="form-label">Checkpoints Directory</label>
        <input type="text" class="form-control" id="SIAMESE_PATHS.TRAINING.CHECKPOINTS" name="SIAMESE_PATHS.TRAINING.CHECKPOINTS" value="{{ config.SIAMESE_PATHS.TRAINING.CHECKPOINTS }}">
    </div>

    <div class="mb-3">
        <label for="SIAMESE_PATHS.TRAINING.MODEL" class="form-label">Model Directory</label>
        <input type="text" class="form-control" id="SIAMESE_PATHS.TRAINING.MODEL" name="SIAMESE_PATHS.TRAINING.MODEL" value="{{ config.SIAMESE_PATHS.TRAINING.MODEL }}">
    </div>

    <button type="submit" class="btn btn-primary">Save Siamese Network Paths</button>
</form>
