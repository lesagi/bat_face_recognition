<!-- Segmentation Configuration -->
<div class="row">
  <!-- Paths Configuration -->
  <div class="col-md-6">
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="mb-0">Paths Configuration</h5>
      </div>
      <div class="card-body">
        <form id="segmentationPathsForm">
          <div class="mb-3">
            <label for="SEGMENTATION_PATHS.BASE" class="form-label"
              >Base Directory</label
            >
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                id="SEGMENTATION_PATHS.BASE"
                name="SEGMENTATION_PATHS.BASE"
                value="{{ config.SEGMENTATION_PATHS.BASE }}"
              />
              <input
                type="file"
                class="d-none"
                id="SEGMENTATION_PATHS.BASE_picker"
                webkitdirectory
              />
              <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="document.getElementById('SEGMENTATION_PATHS.BASE_picker').click()"
                title="Browse for folder"
              >
                📁
              </button>
            </div>
            <div class="form-text">
              Base directory for segmentation files (you can type the path or
              use the browse button)
            </div>
          </div>
          <div class="mb-3">
            <label for="SEGMENTATION_PATHS.BASE" class="form-label"
              >Base Directory</label
            >
            <input
              type="text"
              class="form-control"
              id="SEGMENTATION_PATHS.BASE"
              name="SEGMENTATION_PATHS.BASE"
              value="{{ config.SEGMENTATION_PATHS.BASE }}"
            />
            <div class="form-text">Base directory for segmentation files</div>
          </div>

          <div class="mb-3">
            <label for="SEGMENTATION_PATHS.DATA" class="form-label"
              >Data Directory</label
            >
            <input
              type="text"
              class="form-control"
              id="SEGMENTATION_PATHS.DATA"
              name="SEGMENTATION_PATHS.DATA"
              value="{{ config.SEGMENTATION_PATHS.DATA }}"
            />
          </div>

          <div class="mb-3">
            <label for="SEGMENTATION_PATHS.MODEL" class="form-label"
              >Model Directory</label
            >
            <input
              type="text"
              class="form-control"
              id="SEGMENTATION_PATHS.MODEL"
              name="SEGMENTATION_PATHS.MODEL"
              value="{{ config.SEGMENTATION_PATHS.MODEL }}"
            />
          </div>

          <div class="mb-3">
            <label for="SEGMENTATION_PATHS.CONFIG" class="form-label"
              >Config Directory</label
            >
            <input
              type="text"
              class="form-control"
              id="SEGMENTATION_PATHS.CONFIG"
              name="SEGMENTATION_PATHS.CONFIG"
              value="{{ config.SEGMENTATION_PATHS.CONFIG }}"
            />
          </div>

          <button type="submit" class="btn btn-primary">
            Save Paths Configuration
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Model Configuration -->
  <div class="col-md-6">
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="mb-0">Model Configuration</h5>
      </div>
      <div class="card-body">
        <form id="segmentationForm">
          <div class="mb-4">
            <h6 class="border-bottom pb-2">Model Settings</h6>
            <div class="mb-3">
              <label for="modelPath" class="form-label">Model Path</label>
              <input
                type="text"
                class="form-control"
                id="modelPath"
                name="SEGMENTATION_PATHS.MODEL"
                value="{{ config.SEGMENTATION_PATHS.MODEL }}"
                readonly
              />
              <div class="form-text">Path to the segmentation model file</div>
            </div>
          </div>

          <div class="mb-4">
            <h6 class="border-bottom pb-2">Training Settings</h6>
            <div class="mb-3">
              <label for="segEpochs" class="form-label">Training Epochs</label>
              <input
                type="number"
                class="form-control"
                id="segEpochs"
                name="EPOCHS"
                value="{{ config.EPOCHS }}"
                min="1"
                max="1000"
              />
              <div class="form-text">Number of training epochs</div>
            </div>
            <div class="mb-3">
              <label for="batchSize" class="form-label">Batch Size</label>
              <input
                type="number"
                class="form-control"
                id="batchSize"
                name="BATCH_SIZE"
                value="{{ config.BATCH_SIZE }}"
                min="1"
                max="64"
              />
              <div class="form-text">Number of samples per training batch</div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            Save Model Configuration
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
