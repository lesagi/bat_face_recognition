<div class="container mt-4">
  <!-- Original Form -->
  <form id="segmentationPathsForm">
    <h3>Segmentation Paths Configuration</h3>

    <div class="mb-3">
      <label for="SEGMENTATION_PATHS.BASE" class="form-label"
        >Base Directory</label
      >
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          id="SEGMENTATION_PATHS.BASE"
          name="SEGMENTATION_PATHS.BASE"
          value="/Users/username/segmentation/base"
        />
        <button
          type="button"
          class="btn btn-outline-secondary"
          onclick="openFolderBrowser('SEGMENTATION_PATHS.BASE')"
        >
          Browse
        </button>
      </div>
      <div class="form-text">Base directory for segmentation files</div>
    </div>

    <div class="mb-3">
      <label for="SEGMENTATION_PATHS.DATA" class="form-label"
        >Data Directory</label
      >
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          id="SEGMENTATION_PATHS.DATA"
          name="SEGMENTATION_PATHS.DATA"
          value="/Users/username/segmentation/data"
        />
        <button
          type="button"
          class="btn btn-outline-secondary"
          onclick="openFolderBrowser('SEGMENTATION_PATHS.DATA')"
        >
          Browse
        </button>
      </div>
    </div>

    <div class="mb-3">
      <label for="SEGMENTATION_PATHS.MODEL" class="form-label"
        >Model Directory</label
      >
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          id="SEGMENTATION_PATHS.MODEL"
          name="SEGMENTATION_PATHS.MODEL"
          value="/Users/username/segmentation/model"
        />
        <button
          type="button"
          class="btn btn-outline-secondary"
          onclick="openFolderBrowser('SEGMENTATION_PATHS.MODEL')"
        >
          Browse
        </button>
      </div>
    </div>

    <div class="mb-3">
      <label for="SEGMENTATION_PATHS.CONFIG" class="form-label"
        >Config Directory</label
      >
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          id="SEGMENTATION_PATHS.CONFIG"
          name="SEGMENTATION_PATHS.CONFIG"
          value="/Users/username/segmentation/config"
        />
        <button
          type="button"
          class="btn btn-outline-secondary"
          onclick="openFolderBrowser('SEGMENTATION_PATHS.CONFIG')"
        >
          Browse
        </button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">
      Save Segmentation Paths
    </button>
  </form>

  <!-- Folder Browser Modal -->
  <div class="modal fade" id="folderBrowserModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Select Folder</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>
        </div>
        <div class="modal-body">
          <!-- Breadcrumb navigation -->
          <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb" id="breadcrumb"></ol>
          </nav>

          <!-- Current path display -->
          <div class="mb-3">
            <strong>Current Path:</strong> <span id="currentPath">/</span>
          </div>

          <!-- Folder listing -->
          <div id="folderList">
            <div class="text-center p-4">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="button" class="btn btn-primary" id="selectFolder">
            Select This Folder
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
