<div class="card">
  <div class="card-header">
    <h5 class="mb-0">Visualization Configuration</h5>
  </div>
  <div class="card-body">
    <form id="visualizationConfigForm">
      <div class="mb-3">
        <label for="modelPath" class="form-label">Model Path</label>
        <input
          type="text"
          class="form-control"
          id="modelPath"
          name="modelPath"
          value="{{ config.VISUALIZATION_CONFIG.MODEL_PATH }}"
          placeholder="Enter path to .h5 model file"
          required
        />
      </div>

      <div class="mb-3">
        <label for="inputDir" class="form-label">Input Directory</label>
        <input
          type="text"
          class="form-control"
          id="inputDir"
          name="inputDir"
          value="{{ config.VISUALIZATION_CONFIG.INPUT_DIR }}"
          placeholder="Enter input directory path"
          required
        />
      </div>

      <div class="mb-3">
        <label for="outputDir" class="form-label">Output Directory</label>
        <input
          type="text"
          class="form-control"
          id="outputDir"
          name="outputDir"
          value="{{ config.VISUALIZATION_CONFIG.OUTPUT_DIR }}"
          placeholder="Enter output directory path"
          required
        />
      </div>

      <div class="mb-3">
        <label for="nesting" class="form-label"
          >Subdirectory Structure (optional)</label
        >
        <input
          type="text"
          class="form-control"
          id="nesting"
          name="nesting"
          value="{{ config.VISUALIZATION_CONFIG.NESTING }}"
          placeholder="e.g., species/individual"
        />
      </div>

      <div class="mb-3">
        <label for="sampleSize" class="form-label"
          >Number of Images to Process</label
        >
        <input
          type="number"
          class="form-control"
          id="sampleSize"
          name="sampleSize"
          value="{{ config.VISUALIZATION_CONFIG.SAMPLE_SIZE }}"
          min="1"
          required
        />
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="figureWidth" class="form-label"
            >Figure Width (inches)</label
          >
          <input
            type="number"
            class="form-control"
            id="figureWidth"
            name="figureWidth"
            value="{{ config.VISUALIZATION_CONFIG.FIGURE_SIZE[0] }}"
            min="1"
            step="0.1"
            required
          />
        </div>
        <div class="col-md-6">
          <label for="figureHeight" class="form-label"
            >Figure Height per Image (inches)</label
          >
          <input
            type="number"
            class="form-control"
            id="figureHeight"
            name="figureHeight"
            value="{{ config.VISUALIZATION_CONFIG.FIGURE_SIZE[1] }}"
            min="1"
            step="0.1"
            required
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="rowSpacing" class="form-label"
          >Space Between Rows (inches)</label
        >
        <input
          type="number"
          class="form-control"
          id="rowSpacing"
          name="rowSpacing"
          value="{{ config.VISUALIZATION_CONFIG.ROW_SPACING }}"
          min="0"
          step="0.1"
          required
        />
      </div>

      <div class="row">
        <div class="col-md-6">
          <label for="imageWidth" class="form-label"
            >Image Width (pixels)</label
          >
          <input
            type="number"
            class="form-control"
            id="imageWidth"
            name="imageWidth"
            value="{{ config.VISUALIZATION_CONFIG.IMAGE_SIZE[0] }}"
            min="1"
            required
          />
        </div>
        <div class="col-md-6">
          <label for="imageHeight" class="form-label"
            >Image Height (pixels)</label
          >
          <input
            type="number"
            class="form-control"
            id="imageHeight"
            name="imageHeight"
            value="{{ config.VISUALIZATION_CONFIG.IMAGE_SIZE[1] }}"
            min="1"
            required
          />
        </div>
      </div>

      <div
        class="row mb-3 d-grid gap-3"
        style="grid-template-columns: 1fr 1fr; margin-top: 10px"
      >
        <button type="submit" class="btn btn-primary">
          Save Configuration
        </button>
        <button type="button" class="btn btn-info" id="runVisualization">
          Create Saliency Maps
        </button>
      </div>
      <div id="visualizationStatus" class="mb-3"></div>
    </form>
  </div>
</div>
