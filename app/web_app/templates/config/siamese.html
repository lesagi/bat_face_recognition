<!-- Siamese Network Configuration -->
<div class="row">
    <!-- Paths Configuration -->
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Paths Configuration</h5>
            </div>
            <div class="card-body">
                <form id="siamesePathsForm">
                    <div class="mb-3">
                        <label for="SIAMESE_PATHS.BASE" class="form-label">Base Directory</label>
                        <input type="text" class="form-control" id="SIAMESE_PATHS.BASE" name="SIAMESE_PATHS.BASE" value="{{ config.SIAMESE_PATHS.BASE }}">
                        <div class="form-text">Base directory for siamese network files</div>
                    </div>

                    <h6 class="mt-4">Training Paths</h6>
                    <div class="mb-3">
                        <label for="SIAMESE_PATHS.TRAINING.DATA" class="form-label">Training Data Directory</label>
                        <input type="text" class="form-control" id="SIAMESE_PATHS.TRAINING.DATA" name="SIAMESE_PATHS.TRAINING.DATA" value="{{ config.SIAMESE_PATHS.TRAINING.DATA }}">
                    </div>

                    <div class="mb-3">
                        <label for="SIAMESE_PATHS.TRAINING.OUTPUT" class="form-label">Output Directory</label>
                        <input type="text" class="form-control" id="SIAMESE_PATHS.TRAINING.OUTPUT" name="SIAMESE_PATHS.TRAINING.OUTPUT" value="{{ config.SIAMESE_PATHS.TRAINING.OUTPUT }}">
                    </div>

                    <div class="mb-3">
                        <label for="SIAMESE_PATHS.TRAINING.CHECKPOINTS" class="form-label">Checkpoints Directory</label>
                        <input type="text" class="form-control" id="SIAMESE_PATHS.TRAINING.CHECKPOINTS" name="SIAMESE_PATHS.TRAINING.CHECKPOINTS" value="{{ config.SIAMESE_PATHS.TRAINING.CHECKPOINTS }}">
                    </div>

                    <div class="mb-3">
                        <label for="SIAMESE_PATHS.TRAINING.MODEL" class="form-label">Model Directory</label>
                        <input type="text" class="form-control" id="SIAMESE_PATHS.TRAINING.MODEL" name="SIAMESE_PATHS.TRAINING.MODEL" value="{{ config.SIAMESE_PATHS.TRAINING.MODEL }}">
                    </div>

                    <button type="submit" class="btn btn-primary">Save Paths Configuration</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Model Configuration -->
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Model Configuration</h5>
            </div>
            <div class="card-body">
                <form id="siameseForm">
                    <div class="mb-4">
                        <h6 class="border-bottom pb-2">Model Settings</h6>
                        <div class="mb-3">
                            <label for="inputEdgeLength" class="form-label">Input Edge Length</label>
                            <input type="number" class="form-control" id="inputEdgeLength" name="INPUT_EDGE_LENGTH" value="{{ config.INPUT_EDGE_LENGTH }}" min="32" max="1024" step="32">
                            <div class="form-text">Size of input images (width and height in pixels)</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <h6 class="border-bottom pb-2">Training Settings</h6>
                        <div class="mb-3">
                            <label for="trainEpochs" class="form-label">Training Epochs</label>
                            <input type="number" class="form-control" id="trainEpochs" name="EPOCHS" value="{{ config.EPOCHS }}" min="1" max="1000">
                            <div class="form-text">Number of training epochs</div>
                        </div>
                        <div class="mb-3">
                            <label for="maxDataSize" class="form-label">Maximum Training Data Size</label>
                            <input type="number" class="form-control" id="maxDataSize" name="TRAINING_DATA_MAX_SIZE_LIMIT" value="{{ config.TRAINING_DATA_MAX_SIZE_LIMIT }}" min="100" step="100">
                            <div class="form-text">Maximum number of training samples to use</div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Model Configuration</button>
                </form>
            </div>
        </div>
    </div>
</div>
