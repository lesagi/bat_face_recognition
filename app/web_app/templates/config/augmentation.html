<!-- Augmentation Configuration -->
<div class="row">
    <!-- Paths Configuration -->
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header">
                <h6 class="mb-0">Paths Configuration</h6>
            </div>
            <div class="card-body">
                <form id="augmentationPathsForm">
                    <div class="mb-3">
                        <label for="augmentationBasePath" class="form-label">Base Directory</label>
                        <input type="text" class="form-control" id="augmentationBasePath" name="AUGMENTATION_PATHS.BASE" value="{{ config.AUGMENTATION_PATHS.BASE }}" readonly>
                        <div class="form-text">Base directory for augmentation data</div>
                    </div>

                    <div class="mb-3">
                        <label for="augmentationInputPath" class="form-label">Input Directory</label>
                        <input type="text" class="form-control" id="augmentationInputPath" name="AUGMENTATION_PATHS.INPUT" value="{{ config.AUGMENTATION_PATHS.INPUT }}">
                        <div class="form-text">Directory containing input images for augmentation</div>
                    </div>

                    <div class="mb-3">
                        <label for="augmentationOutputPath" class="form-label">Output Directory</label>
                        <input type="text" class="form-control" id="augmentationOutputPath" name="AUGMENTATION_PATHS.OUTPUT" value="{{ config.AUGMENTATION_PATHS.OUTPUT }}">
                        <div class="form-text">Directory where augmented images will be saved</div>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Paths</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Model Configuration -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h6 class="mb-0">Model Configuration</h6>
            </div>
            <div class="card-body">
                <form id="augmentationModelForm">
                    <div class="mb-3">
                        <label class="form-label">Augmentation Types</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="AUGMENTATION_TYPES[]" value="rotation" id="augRotation" {% if 'rotation' in config.AUGMENTATION_TYPES %}checked{% endif %}>
                            <label class="form-check-label" for="augRotation">Rotation</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="AUGMENTATION_TYPES[]" value="flip" id="augFlip" {% if 'flip' in config.AUGMENTATION_TYPES %}checked{% endif %}>
                            <label class="form-check-label" for="augFlip">Flip</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="AUGMENTATION_TYPES[]" value="brightness" id="augBrightness" {% if 'brightness' in config.AUGMENTATION_TYPES %}checked{% endif %}>
                            <label class="form-check-label" for="augBrightness">Brightness</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="AUGMENTATION_TYPES[]" value="contrast" id="augContrast" {% if 'contrast' in config.AUGMENTATION_TYPES %}checked{% endif %}>
                            <label class="form-check-label" for="augContrast">Contrast</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="AUGMENTATION_TYPES[]" value="noise" id="augNoise" {% if 'noise' in config.AUGMENTATION_TYPES %}checked{% endif %}>
                            <label class="form-check-label" for="augNoise">Noise</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="augmentationFactor" class="form-label">Augmentation Factor</label>
                        <input type="number" class="form-control" id="augmentationFactor" name="AUGMENTATION_FACTOR" value="{{ config.AUGMENTATION_FACTOR }}" min="1">
                        <div class="form-text">Number of augmented images to generate per input image</div>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Model Configuration</button>
                </form>
            </div>
        </div>
    </div>
</div>
