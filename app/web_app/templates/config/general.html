<form id="generalForm">
  <div class="mb-4">
    <h6 class="border-bottom pb-2">General Settings</h6>
    <div class="form-check form-switch mb-3">
      <input
        class="form-check-input"
        type="checkbox"
        id="gpuEnabled"
        name="GPU_ENABLED"
        {%
        if
        config.GPU_ENABLED
        %}checked{%
        endif
        %}
      />
      <label class="form-check-label" for="gpuEnabled">GPU Enabled</label>
    </div>
  </div>

  <div class="mb-4">
    <h6 class="border-bottom pb-2">MLflow Configuration</h6>
    <div class="form-check form-switch mb-3">
      <input
        class="form-check-input"
        type="checkbox"
        id="mlflowEnabled"
        name="MLFLOW_ENABLED"
        {%
        if
        config.MLFLOW_ENABLED
        %}checked{%
        endif
        %}
      />
      <label class="form-check-label" for="mlflowEnabled"
        >MLflow Tracking Enabled</label
      >
    </div>
    <div class="mb-3">
      <label for="mlflowHost" class="form-label">MLflow Tracking Host</label>
      <input
        type="text"
        class="form-control"
        id="mlflowHost"
        name="MLFLOW_TRACKING_HOST"
        value="{{ config.MLFLOW_TRACKING_HOST if config.MLFLOW_TRACKING_HOST else 'localhost' }}"
        placeholder="localhost"
      />
    </div>
    <div class="mb-3">
      <label for="mlflowPort" class="form-label">MLflow Tracking Port</label>
      <input
        type="number"
        class="form-control"
        id="mlflowPort"
        name="MLFLOW_TRACKING_PORT"
        value="{{ config.MLFLOW_TRACKING_PORT if config.MLFLOW_TRACKING_PORT else '8080' }}"
        placeholder="8080"
        min="1"
        max="65535"
      />
    </div>
  </div>

  <div class="d-grid gap-2">
    <button type="submit" class="btn btn-primary">Save General Settings</button>
  </div>
</form>
