<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuration Editor</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css"
    />
    <style>
      .CodeMirror {
        height: 500px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      .navbar {
        margin-bottom: 20px;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folder Picker Interface</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .folder-item {
        cursor: pointer;
        padding: 8px 12px;
        border-radius: 4px;
        transition: background-color 0.2s;
      }
      .folder-item:hover {
        background-color: #f8f9fa;
      }
      .folder-item.selected {
        background-color: #e3f2fd;
      }
      .breadcrumb-item a {
        text-decoration: none;
      }
      #folderList {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid #dee2e6;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Configuration Editor</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/">Edit</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/backups">Backups</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">{% block content %}{% endblock %}</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
      let currentTargetInput = null;
      let currentPath = "/Users";
      let selectedFolder = null;

      function openFolderBrowser(inputId) {
        currentTargetInput = inputId;
        const modal = new bootstrap.Modal(
          document.getElementById("folderBrowserModal")
        );

        // Start from the current input value if it exists and is valid
        const currentValue = document.getElementById(inputId).value;
        if (currentValue && currentValue.startsWith("/")) {
          currentPath = currentValue;
        } else {
          currentPath = "/Users"; // Default to Users folder on macOS
        }

        loadFolderContents(currentPath);
        modal.show();
      }

      async function loadFolderContents(path) {
        const folderList = document.getElementById("folderList");
        const currentPathElement = document.getElementById("currentPath");
        const breadcrumbElement = document.getElementById("breadcrumb");

        folderList.innerHTML =
          '<div class="text-center p-4"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>';

        try {
          // In a real implementation, this would call your Flask endpoint
          // const response = await fetch(`/browse_folders?path=${encodeURIComponent(path)}`);
          // const data = await response.json();

          // Mock data for demonstration
          const data = await mockFolderBrowse(path);

          currentPath = data.current_path;
          currentPathElement.textContent = currentPath;
          selectedFolder = currentPath;

          // Update breadcrumb
          updateBreadcrumb(currentPath);

          // Clear and populate folder list
          folderList.innerHTML = "";

          // Add parent directory option if not at root
          if (data.parent_dir) {
            const parentItem = createFolderItem("..", data.parent_dir, true);
            folderList.appendChild(parentItem);
          }

          // Add folders
          data.items.forEach((item) => {
            if (item.type === "folder") {
              const folderItem = createFolderItem(item.name, item.path, false);
              folderList.appendChild(folderItem);
            }
          });

          if (data.items.length === 0 && !data.parent_dir) {
            folderList.innerHTML =
              '<div class="text-center p-4 text-muted">No folders found</div>';
          }
        } catch (error) {
          folderList.innerHTML = `<div class="text-center p-4 text-danger">Error loading folders: ${error.message}</div>`;
        }
      }

      function createFolderItem(name, path, isParent) {
        const item = document.createElement("div");
        item.className = "folder-item d-flex align-items-center";
        item.innerHTML = `
                <span class="me-2">${isParent ? "📁" : "📂"}</span>
                <span>${name}</span>
            `;

        item.addEventListener("click", () => {
          if (isParent) {
            loadFolderContents(path);
          } else {
            // Remove previous selection
            document
              .querySelectorAll(".folder-item.selected")
              .forEach((el) => el.classList.remove("selected"));
            // Add selection to clicked item
            item.classList.add("selected");
            selectedFolder = path;
          }
        });

        item.addEventListener("dblclick", () => {
          if (!isParent) {
            loadFolderContents(path);
          }
        });

        return item;
      }

      function updateBreadcrumb(path) {
        const breadcrumb = document.getElementById("breadcrumb");
        breadcrumb.innerHTML = "";

        const parts = path.split("/").filter((part) => part);
        let currentPath = "";

        // Add root
        const rootItem = document.createElement("li");
        rootItem.className = "breadcrumb-item";
        rootItem.innerHTML =
          '<a href="#" onclick="loadFolderContents(\'/\')">Root</a>';
        breadcrumb.appendChild(rootItem);

        // Add path parts
        parts.forEach((part, index) => {
          currentPath += "/" + part;
          const item = document.createElement("li");
          item.className = "breadcrumb-item";

          if (index === parts.length - 1) {
            item.textContent = part;
            item.classList.add("active");
          } else {
            const link = currentPath;
            item.innerHTML = `<a href="#" onclick="loadFolderContents('${link}')">${part}</a>`;
          }

          breadcrumb.appendChild(item);
        });
      }

      // Mock function - replace with actual API call
      async function mockFolderBrowse(path) {
        // Simulate API delay
        await new Promise((resolve) => setTimeout(resolve, 300));

        // Mock folder structure
        const mockFolders = {
          "/Users": {
            current_path: "/Users",
            parent_dir: "/",
            items: [
              { name: "username", path: "/Users/username", type: "folder" },
              { name: "Shared", path: "/Users/Shared", type: "folder" },
            ],
          },
          "/Users/username": {
            current_path: "/Users/username",
            parent_dir: "/Users",
            items: [
              {
                name: "Documents",
                path: "/Users/username/Documents",
                type: "folder",
              },
              {
                name: "Desktop",
                path: "/Users/username/Desktop",
                type: "folder",
              },
              {
                name: "Downloads",
                path: "/Users/username/Downloads",
                type: "folder",
              },
              {
                name: "segmentation",
                path: "/Users/username/segmentation",
                type: "folder",
              },
            ],
          },
          "/Users/username/segmentation": {
            current_path: "/Users/username/segmentation",
            parent_dir: "/Users/username",
            items: [
              {
                name: "base",
                path: "/Users/username/segmentation/base",
                type: "folder",
              },
              {
                name: "data",
                path: "/Users/username/segmentation/data",
                type: "folder",
              },
              {
                name: "model",
                path: "/Users/username/segmentation/model",
                type: "folder",
              },
              {
                name: "config",
                path: "/Users/username/segmentation/config",
                type: "folder",
              },
            ],
          },
        };

        return (
          mockFolders[path] || {
            current_path: path,
            parent_dir: path.split("/").slice(0, -1).join("/") || "/",
            items: [],
          }
        );
      }

      // Handle folder selection
      document.getElementById("selectFolder").addEventListener("click", () => {
        if (selectedFolder && currentTargetInput) {
          document.getElementById(currentTargetInput).value = selectedFolder;
          const modal = bootstrap.Modal.getInstance(
            document.getElementById("folderBrowserModal")
          );
          modal.hide();
        }
      });

      // Handle form submission
      document
        .getElementById("segmentationPathsForm")
        .addEventListener("submit", (e) => {
          e.preventDefault();

          const formData = new FormData(e.target);
          const paths = Object.fromEntries(formData.entries());

          console.log("Saving paths:", paths);

          // In real implementation, send to Flask backend
          // fetch('/save_segmentation_paths', {
          //     method: 'POST',
          //     body: formData
          // }).then(response => response.json())
          //   .then(data => console.log(data));

          alert("Paths saved successfully!");
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/yaml/yaml.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
