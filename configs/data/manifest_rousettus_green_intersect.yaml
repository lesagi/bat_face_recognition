# rousettus green backgrounds restricted to the 1059 basenames present in ALL
# three background builds.
#
# Why this exists: the green build produced 1093 images while original/random
# produced 1059 -- 34 green-only frames (concentrated in larry and charlie) have
# no original_bg file on disk. So the published within-species background
# comparison trained green on a different image set from the other two arms.
# `original` and `random` are already exactly this intersection (verified:
# identical basename sets), so restricting green makes all three comparable.
#
# `background: green_isect` is a LABEL, not a filter -- load_manifest never reads
# it. It exists so run directories, plot titles, MLflow params and
# aggregate_kfold.py's (species, model, bg, fold_id) cell key all distinguish
# this arm from the published `green` one. The CSV's own background column stays
# the `green` literal that bat_core.ImageRecord requires.
manifest_path: data/manifests/rousettus_green_bg_intersect_manifest.csv
species: rousettus
background: green_isect
source: video
augmented: false
split_mode: identity_disjoint
split_seed: 42
val_fraction: 0.25
test_fraction: 0.25
batch_size: 32
num_workers: 0

# --- Runtime re-split (k-fold study). Bounds unchanged from
# manifest_rousettus_green.yaml: the intersection drops images, not identities,
# so the pool is still 12 bats.
resplit: false
split_size_mode: exact # exact | seeded
fold_id: null # set via `bat-cli train --fold N`; derives split_seed
fold_base_seed: 1000
min_val_identities: 2
max_val_identities: 3
min_test_identities: 2
max_test_identities: 5 # rousettus: 12 identities total
min_train_identities: 4
