# @package _global_
# Tuned AdaFace on rousettus video frames, original backgrounds (Adam lr=1e-3,
# m=0.2, s=30) with the corrected AdaFace additive margin (PR1).
#   bat-cli train --experiment adaface_rousettus_original_bg_video_tuned
defaults:
  - override /data: manifest_rousettus_original
  - override /model: adaface
  - override /loss: adaface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: original
  source: video
