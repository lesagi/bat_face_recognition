# @package _global_
# Tuned AdaFace on rousettus video frames, green backgrounds (Adam lr=1e-3,
# m=0.2, s=30) with the corrected AdaFace additive margin (PR1).
#   bat-cli train --experiment adaface_rousettus_green_bg_video_tuned
defaults:
  - override /data: manifest_rousettus_green
  - override /model: adaface
  - override /loss: adaface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: green
  source: video
