# @package _global_
# Phase 3 arm 3C: tuned ArcFace trained on face-removed mauritius images derived
# from the original background. Causally tests the background leak that
# docs/background_leakage.md establishes model-free.
#   bat-cli train --experiment arcface_mauritius_bgonly_original_bg_video_tuned
defaults:
  - override /data: manifest_mauritius_bgonly_original
  - override /model: arcface
  - override /loss: arcface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: original_bgonly
  source: video
