# @package _global_
# Tuned AdaFace on mauritius video frames, original backgrounds (Adam lr=1e-3,
# m=0.2, s=30).
#   bat-cli train --experiment adaface_mauritius_original_bg_video_tuned
defaults:
  - override /data: manifest_mauritius_original
  - override /model: adaface
  - override /loss: adaface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: original
  source: video
