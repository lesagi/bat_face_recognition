# @package _global_
# Tuned ArcFace on mauritius video frames, random composited backgrounds.
# Random-specific HPs from Optuna (study arcface_mauritius_random_search,
# val/roc_auc 0.701): m=0.186, s=37.6, Adam lr=1.45e-3. rousettus keeps the
# shared arcface_tuned recipe (untouched).
#   bat-cli train --experiment arcface_mauritius_random_bg_video_tuned
defaults:
  - override /data: manifest_mauritius
  - override /model: arcface
  - override /loss: arcface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: random
  source: video

loss:
  margin: 0.186
  scale: 37.6

trainer:
  lr: 1.45e-3
