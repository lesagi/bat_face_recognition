# @package _global_
# Adaface on the pool40 mauritius arm, random backgrounds.
#   bat-cli train --experiment adaface_mauritius_pool40_random_bg_video_tuned --fold N
defaults:
  - override /data: manifest_mauritius_pool40_random
  - override /model: adaface
  - override /loss: adaface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: random_pool40
  source: video
