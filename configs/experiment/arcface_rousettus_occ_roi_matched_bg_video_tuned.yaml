# @package _global_
# Occlusion arm `matched`: tuned ArcFace on rousettus green crops with the SAME NUMBER of pixels destroyed, on the animal, chosen furthest from the eye/nose discs — the area-matched control.
# Twenty folds, so the paired per-fold comparison against `none` has the same
# structure as every other k-fold arm in this project.
#   bat-cli train --experiment arcface_rousettus_occ_roi_matched_bg_video_tuned --fold N
defaults:
  - override /data: manifest_rousettus_occ_roi_matched
  - override /model: arcface
  - override /loss: arcface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: green_occ_matched
  source: video
