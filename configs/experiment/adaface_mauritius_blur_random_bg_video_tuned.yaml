# @package _global_
# Phase 3 arm 3A (blur): tuned Adaface on mauritius video frames, random
# backgrounds, degraded to rousettus image quality by per-bat calibrated Gaussian blur.
# Species comparison with the image-quality confound controlled, all 16 bats kept.
#   bat-cli train --experiment adaface_mauritius_blur_random_bg_video_tuned
defaults:
  - override /data: manifest_mauritius_blur_random
  - override /model: adaface
  - override /loss: adaface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: random_blur
  source: video
