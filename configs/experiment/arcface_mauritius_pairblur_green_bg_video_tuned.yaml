# @package _global_
# ArcFace on the `pairblur` arm: paired bats, resolution matched per pair.
#   bat-cli train --experiment arcface_mauritius_pairblur_green_bg_video_tuned --fold N
defaults:
  - override /data: manifest_mauritius_pairblur_green
  - override /model: arcface
  - override /loss: arcface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: green_pairblur
  source: video
