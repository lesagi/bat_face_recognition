# @package _global_
# Tuned ArcFace on rousettus video frames, random backgrounds (Adam lr=1e-3,
# m=0.2, s=30). Reproduces the paper's "ArcFace v2 (tuned)" rows in one command:
#   bat-cli train --experiment arcface_rousettus_random_bg_video_tuned
defaults:
  - override /data: manifest_rousettus
  - override /model: arcface
  - override /loss: arcface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: random
  source: video
