# @package _global_
# Phase 3 arm 3B: tuned Arcface on rousettus video frames, green backgrounds,
# restricted to the [298, 623] px native-resolution band both species
# share. Species comparison with resolution controlled using real pixels.
#   bat-cli train --experiment arcface_rousettus_band_green_bg_video_tuned
defaults:
  - override /data: manifest_rousettus_band_green
  - override /model: arcface
  - override /loss: arcface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: green_band
  source: video
