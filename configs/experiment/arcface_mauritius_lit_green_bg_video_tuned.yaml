# @package _global_
# ArcFace on the `lit` identity-selection arm, green background.
#   bat-cli train --experiment arcface_mauritius_lit_green_bg_video_tuned --fold N
defaults:
  - override /data: manifest_mauritius_lit_green
  - override /model: arcface
  - override /loss: arcface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: green_lit
  source: video
