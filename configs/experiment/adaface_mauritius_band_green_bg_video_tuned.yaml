# @package _global_
# Phase 3 arm 3B: tuned Adaface on mauritius video frames, green backgrounds,
# restricted to the [298, 623] px native-resolution band both species
# share. Species comparison with resolution controlled using real pixels.
#   bat-cli train --experiment adaface_mauritius_band_green_bg_video_tuned
defaults:
  - override /data: manifest_mauritius_band_green
  - override /model: adaface
  - override /loss: adaface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: green_band
  source: video
