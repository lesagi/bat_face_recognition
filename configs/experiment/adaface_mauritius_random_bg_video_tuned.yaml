# @package _global_
# Tuned AdaFace on mauritius video frames, random composited backgrounds
# (Adam lr=1e-3, m=0.2, s=30).
#   bat-cli train --experiment adaface_mauritius_random_bg_video_tuned
defaults:
  - override /data: manifest_mauritius
  - override /model: adaface
  - override /loss: adaface_tuned
  - override /trainer: embedding_tuned
  - override /evaluation: verification
  - override /preprocessing: yolo

data:
  background: random
  source: video
