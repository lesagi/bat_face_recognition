protocol: verification
threshold_optimization: youden_j
far_targets: [1.0e-3, 1.0e-4]
# Which checkpoint the auto-train pipeline restores before running test
# eval. ``auto`` resolves to each trainer's early-stop monitor metric, so
# test eval uses the checkpoint training actually selected (pair ->
# precision_at_recall_0p75, embedding -> roc_auc) instead of the
# post-early-stop final/EMA weights. ``final`` keeps the in-memory model
# state from end-of-fit; any explicit metric name resolves to
# ``<output_dir>/best_model_<value>.pt``. Missing files fall back to
# ``final`` with a warning.
test_checkpoint: auto
# Which threshold the post-train permutation test uses to binarize scores.
# ``youden_j`` reproduces the legacy behaviour; ``far_1e2`` uses the
# recall-at-FAR=1e-2 operating point; ``recall_0p75`` uses the
# precision-at-recall=0.75 operating point.
permutation_threshold: recall_0p75
