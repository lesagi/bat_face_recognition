family: pair
optimizer: adam
lr: 5.0e-5
weight_decay: 0.0
beta_1: 0.9
beta_2: 0.999
epochs: 80
gradient_accumulation_steps: 1
mixed_precision: bf16
ema_decay: 0.0
warmup_epochs: 0
lr_schedule: constant
early_stop:
  enabled: true
  patience: 5
  min_delta: 1.0e-3
  # Recall at FAR<=1e-2 is the biometric headline metric on small test
  # splits where TAR@FAR=1e-3 budgets <1 mistake. Override per-experiment
  # to ``val/f1`` if you want legacy behaviour.
  monitor: val/recall_at_far_1e2
artifact_retention:
  save_best_f1: true
  save_best_recall: true
  save_best_precision: true
  save_best_loss: true
  save_best_recall_at_far_1e2: true
  save_final_model: false
deterministic: false
