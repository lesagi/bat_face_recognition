[project]
name = "bat-face-rec-project"
version = "0.2.0"
description = "Bat face recognition: PyTorch refactor (Siamese + ArcFace + AdaFace)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "bat-data",
    "bat-preprocessing",
    "bat-models",
    "bat-losses",
    "bat-training",
    "bat-evaluation",
    "bat-interpretability",
    "bat-stats",
    "bat-tracking",
    "bat-reporting",
    "bat-sweeps",
    "bat-cli",
]

[project.scripts]
bat-cli = "bat_cli.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "isort>=5.13",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bat-core = { workspace = true }
bat-data = { workspace = true }
bat-preprocessing = { workspace = true }
bat-models = { workspace = true }
bat-losses = { workspace = true }
bat-training = { workspace = true }
bat-evaluation = { workspace = true }
bat-interpretability = { workspace = true }
bat-stats = { workspace = true }
bat-tracking = { workspace = true }
bat-reporting = { workspace = true }
bat-sweeps = { workspace = true }
bat-cli = { workspace = true }
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

# CUDA 12.1 wheels for torch / torchvision on Linux. Compatible with
# NVIDIA drivers that report CUDA-runtime support >= 12.1 (covers the
# workstation's current driver, which advertises 12.4). On non-Linux
# platforms uv falls back to the default PyPI index, which is fine
# because no GPU support is needed there.
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/*.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages/bat_core"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = "-q --import-mode=importlib"
