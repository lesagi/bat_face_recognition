[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "bat-face-recognition"
version = "1.0.0"
description = "A comprehensive machine learning system for individual bat identification using computer vision"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bat Face Recognition Research Team"},
]
maintainers = [
    {name = "Bat Face Recognition Research Team"},
]
keywords = [
    "computer-vision",
    "deep-learning", 
    "machine-learning",
    "bat-recognition",
    "siamese-networks",
    "yolo",
    "wildlife-conservation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "tensorflow==2.15.0",
    "torch==2.3.0",
    "torchvision==0.18.0",
    "ultralytics==8.2.18",
    "opencv-python==4.9.0.80",
    "numpy>=1.24.4",
    "pandas==2.2.2",
    "scikit-learn==1.5.0",
    "matplotlib==3.8.4",
    "albumentations==1.4.8",
    "Pillow==10.3.0",
    "Flask==3.0.2",
    "mlflow==2.10.2",
    "tqdm==4.66.4",
    "requests==2.31.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "jupyter>=1.0.0",
    "sphinx>=6.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.23.0",
]

[project.scripts]
bat-face-train = "main:main"
bat-face-predict = "generate_predictions:main"
bat-face-web = "web_app.app:main"
bat-face-augment = "face_annotation_eyes_nose.create_augmented_dataset:main"

[project.urls]
Homepage = "https://github.com/your-org/bat-face-recognition"
Documentation = "https://github.com/your-org/bat-face-recognition/docs"
Repository = "https://github.com/your-org/bat-face-recognition"
"Bug Tracker" = "https://github.com/your-org/bat-face-recognition/issues"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "cvat/",
    "face_detection/",
    "face_recognition-*/",
    "output_*/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]