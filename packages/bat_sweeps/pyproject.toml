[project]
name = "bat-sweeps"
version = "0.0.1"
description = "Optuna sweeps over the val split"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "bat-training",
    "optuna>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_sweeps"]
