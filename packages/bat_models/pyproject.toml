[project]
name = "bat-models"
version = "0.0.1"
description = "Siamese / ArcFace / AdaFace nn.Modules"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "torch>=2.3",
    "torchvision>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_models"]
