[project]
name = "bat-training"
version = "0.0.1"
description = "PairTrainer + EmbeddingTrainer (EMA, warmup+cosine, AMP, resume, Accelerate)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "bat-data",
    "bat-models",
    "bat-losses",
    "bat-tracking",
    "bat-evaluation",
    "torch>=2.3",
    "accelerate>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_training"]
