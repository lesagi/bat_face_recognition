[project]
name = "bat-data"
version = "0.0.1"
description = "Manifest builder, dataset, identity-disjoint splitter, miners, profiler"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "pandas>=2.2",
    "opencv-python>=4.8",
    "numpy>=1.26,<2",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "torch>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_data"]
