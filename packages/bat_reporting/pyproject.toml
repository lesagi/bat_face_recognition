[project]
name = "bat-reporting"
version = "0.0.1"
description = "Unified post-training PDF and run-comparison HTML reports"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "bat-evaluation",
    "bat-tracking",
    "bat-stats",
    "bat-interpretability",
    "reportlab>=4.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_reporting"]

[tool.hatch.build.targets.wheel.force-include]
"bat_reporting/templates" = "bat_reporting/templates"
