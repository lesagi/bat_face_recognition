[project]
name = "bat-preprocessing"
version = "0.0.1"
description = "YOLO seg/pose, alignment, background generation, prediction cache, transforms"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "ultralytics>=8.2",
    "opencv-python>=4.8",
    "pillow>=10",
    "numpy>=1.26",
    "albumentations>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_preprocessing"]
