[project]
name = "bat-losses"
version = "0.0.1"
description = "Pair (BCE, Focal, Triplet) and embedding (ArcFace, AdaFace, CosFace, SubCenter) losses"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "torch>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_losses"]
