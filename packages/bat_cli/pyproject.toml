[project]
name = "bat-cli"
version = "0.0.1"
description = "Single-entry interactive launcher with auto post-training pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "bat-data",
    "bat-training",
    "bat-evaluation",
    "bat-reporting",
    "bat-stats",
    "bat-sweeps",
    "bat-tracking",
    "bat-interpretability",
    "click>=8.1",
    "inquirerpy>=0.3",
    "hydra-core>=1.3",
]

[project.scripts]
bat-cli = "bat_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_cli"]
