[project]
name = "bat-interpretability"
version = "0.0.1"
description = "SiameseSaliency, GradCAM, embedding t-SNE/UMAP adapters"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "bat-models",
    "torch>=2.3",
    "scikit-learn>=1.4",
    "umap-learn>=0.5",
    "matplotlib>=3.8",
    "numpy>=1.26,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_interpretability"]
