[project]
name = "bat-tracking"
version = "0.0.1"
description = "MLflow facade with sectioned metrics and registry promotion"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "mlflow>=2.13",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_tracking"]
