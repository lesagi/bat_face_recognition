[project]
name = "bat-core"
version = "0.0.1"
description = "Shared types and interfaces for the bat face recognition workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "torch>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_core"]
