[project]
name = "bat-evaluation"
version = "0.0.1"
description = "Verification (ROC/AUC, threshold opt) + identification (CMC, TAR@FAR, mAP)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bat-core",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "torch>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bat_evaluation"]
